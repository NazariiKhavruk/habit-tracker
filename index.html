<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="HabitFlow — трекер звичок: щоденні відмітки, серії днів поспіль і статистика прогресу.">
    <meta name="color-scheme" content="light dark">
    <title>HabitFlow</title>
    <script>
      // Тему ставимо до завантаження Vue, щоб сторінка не блимала світлою темою
      try {
        var saved = localStorage.getItem('habitflow:theme')
        var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
